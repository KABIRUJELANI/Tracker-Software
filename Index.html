<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles') ?>
</head>
<body>
  <div id="toast-host"></div>
  <div id="loading-msg" style="padding:60px;text-align:center;color:#64748B;">Loading Rumbu Contract Department platform…</div>

  <?!= include('Login') ?>

  <div id="app-shell" style="display:none;">
    <?!= include('Nav') ?>
    <div id="main">
      <div id="topbar" style="display:block;"></div>
      <div id="page-content"></div>
      <div id="main-footer"></div>
    </div>
  </div>

  <?!= include('Scripts') ?>
  <?!= include('DashboardView') ?>
  <?!= include('DailyReportsView') ?>
  <?!= include('IncidentsView') ?>
  <?!= include('FilePositionalView') ?>
  <?!= include('ContractsView') ?>
  <?!= include('JobsView') ?>
  <?!= include('PaymentsView') ?>
  <?!= include('InflowOutflowView') ?>
  <?!= include('ProcurementView') ?>
  <?!= include('CompaniesView') ?>
  <?!= include('ProjectsView') ?>
  <?!= include('RegisterView') ?>
  <?!= include('KpiView') ?>
  <?!= include('EscalationsView') ?>
  <?!= include('AdminView') ?>

  <script>
    var INITIAL_PAGE = '<?= initialPage ?>';

    function renderTopbar_() {
      var org = STATE.bootstrap.org;
      var user = STATE.bootstrap.access.user;
      document.getElementById('topbar').innerHTML =
        '<div id="topbar" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;">' +
          '<div style="justify-self:start;">' +
            '<span onclick="document.getElementById(\'sidebar\').classList.toggle(\'open\')" style="cursor:pointer;font-size:16px;">☰</span>' +
          '</div>' +
          '<div style="justify-self:center;text-align:center;">' +
            '<h1 style="margin:0;color:#fff;font-size:16px;font-weight:800;letter-spacing:0.5px;white-space:nowrap;">' + escapeHtml(org.name) + '</h1>' +
            '<div class="subtitle; margin-right:0px;">' + escapeHtml(org.entity || '') + (org.dept ? ' · ' + escapeHtml(org.dept) : '') + '</div>' +
          '</div>' +
          '<div style="justify-self:end;display:flex;align-items:center;gap:14px;">' +
            '<span class="classification">' + escapeHtml(org.classification) + '</span>' +
            '<div class="user" style="text-align:right; align: right;">' + escapeHtml(user.name) + '<br/><span class="subtitle">' + escapeHtml(user.role) + (user.unit ? ' · ' + user.unit : '') + '</span></div>' +
            '<button class="btn secondary" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.25); align:right;" onclick="doLogout()">Log out</button>' +
          '</div>' +
        '</div>';
    }

    function renderFooter_(page) {
      document.getElementById('main-footer').innerHTML =
        '<span>Rumbu Industries Group — Agriwatts Nigeria Limited — Contract Office</span><span>CONFIDENTIAL · Page: ' + escapeHtml(page || '') + '</span>';
    }

    var _origNavigate = navigate;
    navigate = function (page) { _origNavigate(page); renderFooter_(page); };

    function bootApp_() {
      apiCall('bootstrap').then(function (data) {
        STATE.bootstrap = data;
        hideLoginGate();
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('app-shell').style.display = 'flex';
        renderNav();
        renderTopbar_();
        navigate(INITIAL_PAGE || 'dashboard');
      }).catch(function () {
        // apiCall already handled SESSION_EXPIRED by showing the login gate;
        // for any other failure, fall back to the login gate too so the app
        // never gets stuck on the loading screen.
        showLoginGate();
      });
    }

    function init() {
      if (getSessionToken_()) {
        bootApp_();
      } else {
        showLoginGate();
      }
      wireLoginForm(bootApp_);
    }

    init();
  </script>
</body>
</html>
